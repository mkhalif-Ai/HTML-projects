<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <h1>confrence Registration form</h1>
 <form action="/submit" method="post">
    <h3>personal information</h3>
    <label>full name:</label>
    <input type="text" id="name" name="name">
    <label>Email</label>
    <input type="email" id="email" name="email" required>
    <label>contact number</label>
    <input   placeholder="+254 7XXXXX">
    <h3>confrence details</h3>
    <fieldset>
        <legend>
            <h5> preferred days of attendace</h5><br>
            <label>day1</label>
            <input type="checkbox" name="days">
             <label>day2</label>
            <input type="checkbox" name="days">
             <label>day3</label>
            <input type="checkbox" name="days">
        </legend>
    </fieldset>
    <fieldset>
        <legend>
            <h5>types of attendace</h5><br>
            <label>in-person</label>
            <input type="radio" name="attendace" value="in-person">
            <label>virtual</label> 
            <input type="radio" name="attendace" value="virtual">
        </legend>
    </fieldset>
    <h5>T-shirt size</h5>
    <select>
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
      <option>XXL</option>
    </select>
    <h3>session intrest </h3>
    <label for="intrest">web dev</label>
      <input type="checkbox" name="intrest">
      <label for="">data science</label>
      <input type="checkbox" name="intrest">
      <label for="">cloud computing</label>
      <input type="checkbox" name="intrest">
      <label for="">cyber security</label>
      <input type="checkbox" name="intrest">
      <label for="">AI and machine learnig</label>
      <input type="checkbox" name="intrest">
       <h3>dietary prefence</h3>
       <label>vegetarian</label>
       <input type="checkbox" name="prefence">
        <label>vegan</label>
       <input type="checkbox" name="prefence">
        <label>Gluten-Free</label>
       <input type="checkbox" name="prefence">
        <label>Nut-Free</label>
       <input type="checkbox" name="prefence">
        <label>Dairy-free</label>
       <input type="checkbox" name="prefence">
        <label>NO restriction</label>
       <input type="checkbox" name="prefence">

       <h3>additional message</h3>
       <textarea placeholder="write any comment or message you might have"></textarea>

       <h3>consent section</h3>
       <label>consent to receive updates about the conference via email.</label>
       <input type="checkbox">
       <button type="submit">submit</button>
 </form>
</body>
</html>
